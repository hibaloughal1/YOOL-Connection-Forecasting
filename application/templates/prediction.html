<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yool Education Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.9/flatpickr.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.9/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK" crossorigin="anonymous"></script>
    <style>
    :root {
      --dark-bg: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #0077cc;
      --accent-orange: #f58634;
      --accent-light: #64b5f6;
      --text-light: #ffffff;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--dark-bg);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    .navbar {
      background-color: var(--card-bg);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .navbar .nav-link {
      color: var(--text-muted);
    }

    .navbar .nav-link.active {
      color: var(--accent-orange) !important;
      font-weight: bold;
    }


  </style>

    


</head>
  <body>
  
   
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="{{ url_for('index')}}">
      <img src="../static/images/logo_yool.svg" alt="Yool Logo" height="45">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="{{ url_for('prediction') }}">Prediction</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

  <div class="container mt-4">
  <div class="card shadow-sm border-0" style="max-width: 500px; margin: 0 auto;">
    <div class="card-header text-white" style="background-color: #2E4A9E;">
      <h5 class="mb-0 text-center">🎯Prediction Overview </h5>
    </div>

    <div class="card-body">
      <form action="{{ url_for('prediction') }}" method="post">
        <div class="form-group text-center">
          <label for="dateRangePicker" class="form-label fw-semibold mb-2">
            ⏱ Sélectionnez une date
          </label>
          <input
            type="text"
            id="dateRangePicker"
            name="dateRangePicker"
            class="form-control text-center mx-auto"
            style="width: 220px;"
            placeholder="YYYY-MM-JJ"
          />
          <!-- Champs cachés pour transmettre start et end -->
          <input type="hidden" name="start_date" id="start_date" />
        </div>

        <!-- Error Message -->
        <div id="dateMessage" class="text-danger small text-center mt-2" style="display: none;"></div>

        <!-- Filter Button -->
        <div class="d-flex justify-content-center mt-3">
          <button type="submit" class="btn btn-primary" style="background-color: #2E4A9E; border-color: #2E4A9E;">
            Visualiser
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="chart-container">
  <canvas id="my_chart" width="400" height="150"></canvas>
</div>





<script>
    
    const ctx = document.getElementById("my_chart").getContext("2d");
    const connexions_day = {{ connexions_day | tojson }};
      // Labels triés et formatés en "HH:00"
    const labels = Object.keys(connexions_day)
    .sort((a, b) => Number(a) - Number(b))
    .map(h => h.padStart(2, '0') + ":00");

    // Données du graphique
    const datasetValues = Object.keys(connexions_day)
    .sort((a, b) => Number(a) - Number(b))
    .map(h => connexions_day[h]);

    const data = {
        labels: labels,  
        datasets: [{
        label: "Prediction Connexions",
        data: datasetValues,
        borderColor: "rgba(215, 81, 23, 0.27)",
        backgroundColor: "orange",
        tension: 0.2,
        fill: true
        }]
    };


        const config = {
            type: 'bar',
            data: data
    };

    new Chart(ctx, config);


    

</script>







<script>
  const start_date = "{{ start_date or '' }}";
  const messageBox = document.getElementById("dateMessage");
  messageBox.style.display = "none"; // réinitialise

  flatpickr("#dateRangePicker", {
    mode: "single",               // ✅ sélection simple
    dateFormat: "Y-m-d",
    defaultDate: start_date || "YYYY-MM-JJ",
    locale: { firstDayOfWeek: 1 },
    minDate: "2023-02-20",
    onChange: (selectedDates, dateStr, instance) => {
      if (selectedDates.length === 1) {
        const selected = instance.formatDate(selectedDates[0], "Y-m-d");
        document.getElementById("start_date").value = selected;

      }
    }
  });
</script>

</body>
</html>
